[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudcost-recovery"
version = "0.1.0"
description = "Evidence-backed multi-cloud invoice reconciliation and realized savings verification"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}

[project.scripts]
cloudcost = "cloudcost.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

